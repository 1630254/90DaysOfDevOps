---
# tasks file for roles/nginx
#
- name: Nginx Installation and Configuration
  tags: ["nginx"]
  block:
    - name: Install Nginx
      dnf:
        name: nginx
        state: present
      check_mode: no

    - name: Remove default Nginx site configs
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/conf.d/default.conf
        - /etc/nginx/default.d/
        - /etc/nginx/conf.d/welcome.conf
      notify: Restart Nginx

    - name: Deploy configurations
      template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
      loop:
        - { src: 'nginx.conf.j2', dest: '/etc/nginx/nginx.conf' }
        - { src: 'reverse-proxy.conf.j2', dest: '/etc/nginx/conf.d/reverse-proxy.conf' }
      notify: Restart Nginx

    - name: Allow Nginx to connect to backend (SELinux)
      seboolean:
        name: httpd_can_network_connect
        state: yes
        persistent: yes

    - name: Start and enable Nginx
      service:
        name: nginx
        state: started
        enabled: yes
      when: not ansible_check_mode
